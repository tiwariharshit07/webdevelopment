<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: Poppins, sans-serif;
        }


        nav {
            background-color: rgb(167, 168, 169);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
        }

        .logo img {
            width: 85px;
            border-radius: 50%;
            margin-right: auto;
        }

        .box ul {
            list-style: none;
            display: flex;
            gap: 10px;
        }

        ul li {
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        ul li:hover {
            background: #000;
            color: #fff;
            border-radius: 5px;
        }

        ul li::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 4px;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: white;
            transition: 0.4s;
        }

        ul li:hover::after {
            width: 70%;
        }


        .banner {
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            text-align: center;
        }

        .banner h1 {
            font-family: cursive;
            font-weight: 500;
            max-width: 600px;
            position: relative;
        }

        .banner h1::after {
            content: "";
            position: absolute;
            top: 0;
            left: -20%;
            width: 15%;
            height: 45%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent);
            animation: shine 2.5s infinite;
        }

        @keyframes shine {
            to {
                left: 100%;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .banner img:hover {

            animation: rotate 2s ease-in 0.25s;
            scale: 0.95;
        }

        .banner img:hover::after {
            scale: 1;
        }

        .banner img {
            height: 180px;
            animation: leaf 3s infinite ease-in-out;
        }

        @keyframes leaf {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(10px);
            }

            100% {
                transform: translateX(0);
            }
        }


        .info {
            text-align: center;
            padding: 20px;
            font-family: cursive;
        }


        .container {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .showcase {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .showcase img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.4s ease;
        }

        .showcase img:hover {
            transform: scale(1.06);
        }


        footer p {
            background: black;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }


        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                align-items: center;
            }

            .logo img {
                margin-bottom: 10px;
            }

            .box ul {
                flex-direction: column;
                align-items: center;
            }

            .banner {
                flex-direction: column;
            }

            .banner h1 {
                font-size: 18px;
            }

            .banner img {
                height: 120px;
            }

            .info h2 {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="box">
            <nav>
                <div class="logo">
                    <img src="lion.png" alt="Logo">
                </div>
                <ul>
                    <li>Home</li>
                    <li>My Gallery</li>
                    <li>Explore</li>
                    <li>Contact Us</li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <div class="banner">
            <h1>Hi..This is Harshit Tiwari.. A wild-life and aquatic Photographer.</h1>
            <img src="leaf.png" alt="Leaf">
        </div>

        <div class="info">
            <h2>These are some natural beauty captured by my lens</h2>
        </div>

        <div class="container">
            <div class="showcase">
                <img src="https://cdn.pixabay.com/photo/2018/04/04/08/11/lion-3289124_1280.jpg">

                <img src="https://cdn.pixabay.com/photo/2016/11/22/19/36/arctic-wolf-1850247_1280.jpg">
                <img  src="https://images.pexels.com/photos/2330229/pexels-photo-2330229.jpeg?_gl=1*6t0d5n*_ga*MTIyOTg5MTkzNS4xNzY1NjE4NDA1*_ga_8JE65Q40S6*czE3NjY4NDQ4MDEkbzQkZzEkdDE3NjY4NDQ4NDAkajIxJGwwJGgw">
                <img src="https://images.pexels.com/photos/631317/pexels-photo-631317.jpeg">
                <img src="https://cdn.pixabay.com/photo/2016/04/07/23/19/bear-1315128_1280.jpg">
                <img src="https://cdn.pixabay.com/photo/2017/07/24/19/57/tiger-2535888_1280.jpg">
                <img src="https://cdn.pixabay.com/photo/2024/01/29/20/40/cat-8540772_1280.jpg">
                <img src="https://images.pexels.com/photos/624063/pexels-photo-624063.jpeg?_gl=1*16z7gdf*_ga*MTIyOTg5MTkzNS4xNzY1NjE4NDA1*_ga_8JE65Q40S6*czE3NjY4NDQ4MDEkbzQkZzEkdDE3NjY4NDUwMTUkajQyJGwwJGgw">

            </div>
        </div>

    </main>

</html>
