<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        
        .container{
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
     flex-direction: column;

     background-color: gainsboro ;

        }
        .box{
             display: flex;
          justify-content: center;
          align-items: center;
         flex-direction: column;
         background-color: rgb(66, 239, 239);
         border-radius: 10px;

            height: 45vh;
            width: 35vw;
            box-shadow: 0px 4px 10px;
        }
        
        #btn{
            margin-top: 10px;
            font-weight: bold;
            font-family:cursive;
            color:white;
            background-color: black;
            width: 50px;
            border-radius: 5px;
        }
       
        .nameage{
            margin-top: 10vh;
        }
        #name{
              border-radius: 5px;
              height: 20px;
        }
        #name::placeholder{
             font-weight: bold;
            font-family:cursive;
              
        }
        .nameage{
            font-family: sans-serif;
            font-weight: 600;
            font-size: large;
            margin-left: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
      <div class="box">

        <input id="name" type="text" placeholder="Enter Your Name" />
        
        <button id="btn"> Search</button>

        <div class="nameage">Please wait....
        </div>
      </div>
      

    </div>
    <script src="index.js"></script>
</body>
</html>
