<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register & Chat</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Poppins, sans-serif;
    }

    html,
    body {

      height: 100%;
    }


    .container {
      width: 60%;
      margin: 60px auto;
      padding: 30px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      background: rgb(207, 114, 236);
    }

    .form {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 25px;
    }

    input,
    select {
      margin: 15px 0px 0px 0px;
      padding: 5px;
      width: 32%;
      border-radius: 5px;
      border: 1px solid rgb(188, 177, 177);
      height: 35px;
      font-size: 18px;
    }

    input::placeholder {
      font-size: 16px;
      color: grey;
    }

    button {
      color: white;
      background-color: #007bff;
      width: 32%;
      height: 40px;
      border-radius: 5px;
      margin-top: 10px;
      border: none;
      padding: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:hover {
      background-color: #368be6;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      background: #eee;
      border-radius: 5px;
      text-align: center;
      width: auto;
      font-family: sans-serif;
      font-weight: 600;
    }

    .switchText {
      margin-top: 15px;
      font-weight: 600;
    }

    .switchText span {
      color: blue;
      cursor: pointer;
    }

    /* Chat CSS */
    .chat-mode {
      display: flex;
      height: 100vh;
      background: #1e1e2f;
    }

    .sidebar {
      width: 25%;
      height: 100%;
      background: #27293d;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-bottom: 20px;
    }

    .user {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #32344a;
      transition: 0.3s;
    }

    .user:hover {
      background: #4e54c8;
    }

    .chat-area {
      width: 75%;
      display: flex;
      height: 100%;
      flex-direction: column;
      background: #f4f6ff;
    }

    .chat-header {
      background: #4e54c8;
      color: white;
      padding: 15px;
      font-size: 18px;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 60%;
      padding: 10px 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .sent {
      background: #4e54c8;
      color: white;
      margin-left: auto;
    }

    .received {
      background: #e3e6ff;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      background: #4e54c8;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .chat-input button:hover {
      background: #363bb5;
      transform: scale(1.05);
    }
  </style>
</head>

<body>


  <div class="container" id="authContainer">

    <!-- Register vala part -->
    <div class="form" id="registerForm">
      <input type="text" id="username" placeholder="Username">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <select id="role">
        <option>User</option>
        <option>Admin</option>
      </select>
      <button onclick="registerUser()">Register</button>
      <div id="regMessage"></div>
      <p class="switchText">Not a new user? <span id="showLogin">Login</span></p>
    </div>

    <!-- Login vala part -->
    <div class="form" id="loginForm" style="display:none;">
      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="loginUser()">Login</button>
      <p class="switchText">New user? <span id="showRegister">Register</span></p>
    </div>

  </div>

  <!-- chat vala part -->
  <div class="chat-mode" id="chatContainer" style="display:none;width:100%;">
    <div class="sidebar" id="sidebar">
      <h2>Chats</h2>
      <div id="userList">
        <h3>Online Users</h3>
        <ul id="users"></ul>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="chat-header" id="chat-header"></div>
      <div class="chat-box" id="chat-box"></div>

      <div class="chat-input" id="chat-input">
        <input type="text" id="message" placeholder="Type a message...">
        <button id="submit" type="submit">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const authContainer = document.getElementById("authContainer");
    const chatContainer = document.getElementById("chatContainer");

    // Form toggle
    document.getElementById("showLogin").addEventListener("click", () => {
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("loginForm").style.display = "flex";
    });
    document.getElementById("showRegister").addEventListener("click", () => {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "flex";
    });

    // Socket
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const usersList = document.getElementById('users');
    const messageInput = document.getElementById('message');
    const chatHeader = document.getElementById('chat-header');
    let currentUsername = "";

    // Register
    async function registerUser() {
      const username = document.getElementById("username").value
      const email = document.getElementById("email").value
      const password = document.getElementById("password").value
      const role = document.getElementById("role").value
      const res = await fetch("http://localhost:3000/api/connect/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password, role })
      });
      const data = await res.json();
      document.getElementById("regMessage").innerText = data.message;
    }

    // Login
    async function loginUser() {
      const username = document.getElementById("loginUsername").value
      const password = document.getElementById("loginPassword").value
      const res = await fetch("http://localhost:3000/api/connect/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        currentUsername = username;
        authContainer.style.display = "none";

        chatContainer.style.display = "flex";

        chatHeader.innerText = currentUsername;
        socket.emit('join', currentUsername);
      } else {
        alert("Login failed: " + data.message);
      }
    }

    // informing user has joined
    socket.on('joined', user => addMessage(`${user} has joined the chat`, "received"));
    //informing user has left
    socket.on('userLeft', user => addMessage(`${user} has left the chat`, "received"));
    // setting total users in online section
    socket.on('userlist', users => usersList.innerHTML = users.map(name => `<li>${name}</li>`).join(''));
    // socket.on('chatMessage', msg => addMessage(`${msg.Username}: ${msg.text}`, "received"));
    socket.on('chatMessage', message => {

      const Me = message.Username === currentUsername;

      const type = Me ? "sent" : "received";
      const name = Me ? "You" : message.Username;

      addMessage(`${name}: ${message.text}`, type);

    });
    // 
    document.getElementById('submit').addEventListener('click', event => {
      event.preventDefault();

      // now get the message
      const extracttext = messageInput.value.trim();
      if (extracttext) {
        // addMessage(`You: ${text}`, "sent");
        socket.emit('chatMessage', {
          Username: currentUsername,
          text: extracttext
        });
        messageInput.value = "";
      }
    });

    // Add message
    function addMessage(extracttext, type) {
      const div = document.createElement('div');
      div.classList.add("message", type);
      div.textContent = extracttext;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>

</html>
